<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="27" height="27">
  <!-- A road sign: a rounded diamond plate with a turn-right arrow knocked out
       of it. One even-odd path, so the arrow is a hole the tab bar's own
       background shows through, and the template tint colours only the plate.

       The plate runs almost edge to edge of the 27pt canvas, deliberately. A
       diamond fills half of its bounding square, so at the size of the SF
       Symbols beside it (`flame.fill`, the chart, the gear) it reads a size
       smaller; this is drawn 1.3x about the centre to carry the same weight.
       The canvas itself is unchanged, so the tab bar's height and spacing are
       too. -->
  <path fill="#000000" fill-rule="evenodd" d="
    M41.73 11.47 Q50 3.2 58.27 11.47 L88.53 41.73 Q96.8 50 88.53 58.27
    L58.27 88.53 Q50 96.8 41.73 88.53 L11.47 58.27 Q3.2 50 11.47 41.73 Z
    M31.93 68.2 L31.93 49.61 A10.27 10.27 0 0 1 42.2 39.34 L55.2 39.34 L55.2 34.92
    Q55.2 31.28 58.19 33.36 L69.37 41.29 Q71.84 43.11 69.37 44.93 L58.19 52.86
    Q55.2 54.94 55.2 51.3 L55.2 46.88 L42.2 46.88 A2.73 2.73 0 0 0 39.47 49.61
    L39.47 68.2 A3.77 3.77 0 0 1 31.93 68.2 Z"/>
</svg>
